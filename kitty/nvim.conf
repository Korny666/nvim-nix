# Kitty configuration for the `nvim` launcher of this flake.
#
# Loaded with `kitty --config`, so ~/.config/kitty/kitty.conf is never read
# for these windows: the values below are merged onto kitty's builtin
# defaults and nothing else. That is what makes the font guaranteed.
#
# This file is the single source of truth for the font. The flake reads
# font_family from here at build time and fails the build if that family
# does not exist in the packaged Nerd Font, so a typo never reaches a
# running window.

font_family      InconsolataGo Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# OneDark, matching colorschemes.onedark in the neovim config, so the
# padding around the editor does not clash with the editor itself.
background #282c34
foreground #abb2bf

window_padding_width 4

confirm_os_window_close 0
enable_audio_bell no

# Nothing but neovim ever runs in these windows.
shell_integration disabled
allow_remote_control no
